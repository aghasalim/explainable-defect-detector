[project]
name = "explainable-defect-detector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.0",
    "streamlit>=1.61.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
src = ["src/edd", "."]

[tool.ruff.lint]
# Correctness rules only. Import-order and string-concat style rules were
# fighting the editor's formatter and produced churn without catching bugs.
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# app.py must extend sys.path before importing project modules
"app.py" = ["E402"]
